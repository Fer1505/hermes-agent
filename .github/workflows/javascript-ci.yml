name: JavaScript CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/javascript-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/**"
      - "ui-tui/**"
      - "web/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/javascript-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/**"
      - "ui-tui/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: javascript-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Workspace lint, typecheck, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run JavaScript CI gate
        run: npm run ci:js
